license:              BSD-3-Clause
maintainer:           fabricio.olivetti@gmail.com
author:               Fabricio Olivetti de França
synopsis:             SQL persistence and querying for srtree e-graphs
description:
    Reusable storage layer for srtree multiset e-graphs:
    an SQLite-backed serialization (Algorithm.EqSat.Store rows)
    plus SQL queries (topN, pareto, distribution counts, patterns).
    Dataset-specific fit tables and a PostgreSQL backend come later.

category:             Math, Data
abi:                  inplace
exposed:              True
